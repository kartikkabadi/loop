name: ClawSweeper Live Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "scripts/dashboard-refresh-ci.mjs"
      - "scripts/dashboard-smoke.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/dashboard-ci.yml"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read

concurrency:
  group: clawsweeper-live-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy dashboard Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.OPENCLAW_CLOUDFLARE_ACCOUNT_ID }}
      CLAWSWEEPER_STATUS_URL: https://clawsweeper.openclaw.ai
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-pnpm

      - name: Verify Cloudflare token is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.OPENCLAW_CLOUDFLARE_WORKERS_API_TOKEN || secrets.OPENCLAW_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Sync Worker secrets with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.OPENCLAW_CLOUDFLARE_WORKERS_API_TOKEN || secrets.OPENCLAW_CLOUDFLARE_API_TOKEN }}
          INGEST_TOKEN: ${{ secrets.CLAWSWEEPER_STATUS_INGEST_TOKEN }}
          CLAWSWEEPER_APP_PRIVATE_KEY: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$INGEST_TOKEN"
          test -n "$CLAWSWEEPER_APP_PRIVATE_KEY"
          test -n "$CLAWSWEEPER_WEBHOOK_SECRET"
          secrets_file="$RUNNER_TEMP/clawsweeper-worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e '
            const fs = require("node:fs");
            const names = ["INGEST_TOKEN", "CLAWSWEEPER_APP_PRIVATE_KEY", "CLAWSWEEPER_WEBHOOK_SECRET"];
            const secrets = Object.fromEntries(
              names.map((name) => {
                const text = process.env[name] || "";
                if (!text) process.exit(2);
                return [name, text];
              }),
            );
            fs.writeFileSync(process.argv[1], JSON.stringify(secrets));
          ' "$secrets_file"
          npx wrangler@4.107.0 secret bulk "$secrets_file" --config dashboard/wrangler.toml

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.OPENCLAW_CLOUDFLARE_WORKERS_API_TOKEN || secrets.OPENCLAW_CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4.107.0 deploy --config dashboard/wrangler.toml

      - name: Smoke test live dashboard
        run: pnpm run dashboard:smoke -- "$CLAWSWEEPER_STATUS_URL"
